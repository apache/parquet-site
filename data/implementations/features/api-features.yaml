category_id: api-features
features:
  - id: api-parquet-summary-file
    display_name: Parquet summary file
    note: "Files named _metadata that consolidate footers from multiple parquet files."

  - id: api-sorting-columns
    display_name: Row group "Sorting column" metadata
    note: "In parquet.thrift: RowGroup->sorting_columns"

  - id: api-rowgroup-pruning-stats
    display_name: Row group pruning using statistics

  - id: api-rowgroup-pruning-bloom
    display_name: Row group pruning using bloom filter

  - id: api-rowgroup-pruning-dictionary
    display_name: Row group pruning using dictionary pages
    note: "Skip a row group when a column dictionary proves the predicate cannot match."

  - id: api-column-projection
    display_name: Reading select columns only

  - id: api-page-pruning-stats
    display_name: Page pruning using statistics

  - id: api-payload-page-pruning-row-mask
    display_name: Page pruning using row survival mask
    note: "Decompress and decode only pages containing at least one surviving row. The row survival mask may originate from predicate evaluation or be caller-supplied, e.g. derived from Iceberg/Delta deletion vectors."

  - id: api-sparse-payload-page-io
    display_name: Selective page reads
    note: "Fetch, decompress and decode only the required pages determined by mechanisms in [(6)](/docs/file-format/implementationstatus/#note-api-features-5). Requires an [OffsetIndex](https://parquet.apache.org/docs/file-format/pageindex/) for selected column chunks."

  - id: api-late-materialization
    display_name: Late Materialization
    note: "Evaluate predicate columns first, then use the resulting row mask to skip unneeded payload pages and materialize only surviving rows. See [Arrow blog](https://arrow.apache.org/blog/2025/12/11/parquet-late-materialization-deep-dive/) for details."

  - id: api-separate-io-decoding
    display_name: Caller-driven parquet scan
    note: "Advanced APIs to let callers prune row groups and pages, and schedule I/O and compute work (single-pass or [late materialization](/docs/file-format/implementationstatus/#note-api-features-8)) using the fetched buffers. See [cuDF Hybrid Scan APIs](https://docs.nvidia.com/cudf/latest/libcudf/api_docs/io_readers/#_CPPv4N4cudf2io7parquet12experimental18hybrid_scan_readerE) and [Arrow push decoder](https://arrow.apache.org/rust/parquet/arrow/push_decoder/struct.ParquetPushDecoder.html) for details."
